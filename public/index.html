<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script
      src="https://cdn.socket.io/4.8.3/socket.io.min.js"
      integrity="sha384-kzavj5fiMwLKzzD1f8S7TeoVIEi7uKHvbTA3ueZkrzYq75pNQUiUi6Dy98Q3fxb0"
      crossorigin="anonymous"
    ></script>

    <style>
      /* Only map layout — no custom black/white theme styles */
      #map {
        height: 100vh;
      }
    </style>
  </head>

  <body>
    <!-- Auth guard -->
    <div
      id="authGuard"
      class="fixed inset-0 bg-white z-50 flex items-center justify-center"
    >
      <p class="text-sm text-gray-400">Verifying session…</p>
    </div>

    <div id="map"></div>

    <script
      src="https://cdn.socket.io/4.8.3/socket.io.min.js"
      integrity="sha384-kzavj5fiMwLKzzD1f8S7TeoVIEi7uKHvbTA3ueZkrzYq75pNQUiUi6Dy98Q3fxb0"
      crossorigin="anonymous"
    ></script>

    <script>
      // ─── Auth Guard ───────────────────────────────────────────────────
      const token = localStorage.getItem("token");
      const userDetails = JSON.parse(
        localStorage.getItem("userDetails") || "null",
      );

      if (!token || !userDetails) {
        window.location.href = "login.html";
      }

      const socket = io();
      const map = L.map("map").setView([28.5355, 77.391], 13);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution:
          '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      }).addTo(map);

      function createProfileIcon(profilePic) {
        return L.icon({
          iconUrl:
            profilePic ||
            "https://cdn-icons-png.flaticon.com/512/149/149071.png", // fallback
          iconSize: [40, 40],
          iconAnchor: [20, 20],
          popupAnchor: [0, -20],
          className: "rounded-full border-2 border-white shadow-md",
        });
      }

      const remoteMarkers = new Map();

      socket.on("server:location:update", (data) => {
        console.log("advsadadas ", data);
        const { id, latitude, longitude, user } = data;

        if (!remoteMarkers.has(id)) {
          const marker = L.marker([latitude, longitude], {
            icon: createProfileIcon(user?.profilePic),
          })
            .addTo(map)
            .bindPopup(data?.user?.name);
          remoteMarkers.set(id, marker);
        } else {
          const existingMarker = remoteMarkers.get(id);
          existingMarker.setLatLng([latitude, longitude]);
        }
      });

      function getUsersCurrentLocation() {
        return new Promise((res, rej) => {
          if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
              (position) => {
                // console.log(`Got user's location`, position);
                const latitude = position.coords.latitude;
                const longitude = position.coords.longitude;
                res({ latitude, longitude });
              },
              (err) => {
                rej(err);
              },
              { enableHighAccuracy: true },
            );
          } else {
            alert("Geolocation is not available in this browser");
          }
        });
      }

      let myCurrentLocationMarker = null;

      async function main() {
        setInterval(async () => {
          const { latitude, longitude } = await getUsersCurrentLocation();

          socket.emit("client:location:update", {
            latitude,
            longitude,
            user: {
              name: userDetails.name,
              profilePic: userDetails.profilePic,
            },
          });
          if (!myCurrentLocationMarker) {
            myCurrentLocationMarker = L.marker([latitude, longitude], {
              icon: createProfileIcon(userDetails.profilePic),
            })
              .addTo(map)
              .bindPopup("you are Here ");
          } else {
            myCurrentLocationMarker.setLatLng([latitude, longitude]);
          }
        }, 5 * 1000);

        const userLocation = await getUsersCurrentLocation();
        map.setView([userLocation.latitude, userLocation.longitude], 15);
      }

      window.addEventListener("load", () => {
        main();
      });
    </script>
  </body>
</html>
